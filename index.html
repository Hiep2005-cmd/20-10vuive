<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20-10 Vui Vẻ Nhé 🌸</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hiệu ứng cánh hoa & bụi sao lung linh -->
  <canvas id="petal-canvas"></canvas>

  <main class="page-container">
    <div class="greeting-box">
      <!-- Tag xinh xắn -->
      <div class="badge-pill">
        <span class="sparkle">✨</span> 20 Tháng 10 <span class="sparkle">✨</span>
      </div>

      <!-- Câu chúc chính -->
      <h1 class="simple-wish">20-10 vui vẻ nhé! 🌸</h1>

      <!-- Đường phân cách trái tim đập nhẹ -->
      <div class="wish-divider">
        <span class="line"></span>
        <span class="heart-pulse"><i class="fa-solid fa-heart"></i></span>
        <span class="line"></span>
      </div>

      <!-- Lời nhắn ấm áp, gần gũi -->
      <p class="sweet-message">
        Chúc cậu một ngày ngập tràn niềm vui, nụ cười rạng rỡ lúc nào cũng nở trên môi. Mong cậu luôn an yên, tự tin, xinh đẹp và được yêu thương thật nhiều!
      </p>

      <!-- Tương tác bấm nhận thêm điều ngọt ngào -->
      <div class="interactive-area">
        <button id="btn-sweet-heart" class="btn-heart" type="button">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Chạm để nhận thêm điều ước</span>
        </button>
        <div id="sweet-quote-popup" class="sweet-quote-text">
          "Mong thế giới này luôn dịu dàng với cậu 🌷"
        </div>
      </div>

      <!-- Chữ ký thân thiện -->
      <div class="card-signature">
        — Gửi đến cô bạn đáng yêu của tớ ✨
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
